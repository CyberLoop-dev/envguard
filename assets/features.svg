<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<g><rect x="20" y="20" width="360" height="160" rx="24" fill="#0ea5e9" fill-opacity=".10" stroke="#0ea5e9" stroke-opacity=".35"/>
<circle cx="70" cy="72" r="22" fill="#0ea5e9"><animate attributeName="r" values="22;25;22" dur="3s" repeatCount="indefinite"/></circle>
<text x="108" y="80" font-size="26" font-weight="700" fill="#0ea5e9">Blazing fast</text>
<text x="48" y="134" font-size="20" fill="#64748b">Hundreds of files in milliseconds</text></g>
<g><rect x="420" y="20" width="360" height="160" rx="24" fill="#6366f1" fill-opacity=".10" stroke="#6366f1" stroke-opacity=".35"/>
<circle cx="470" cy="72" r="22" fill="#6366f1"><animate attributeName="r" values="22;25;22" dur="3.4s" repeatCount="indefinite"/></circle>
<text x="508" y="80" font-size="26" font-weight="700" fill="#6366f1">Zero deps</text>
<text x="448" y="134" font-size="20" fill="#64748b">One file, just Python 3</text></g>
<g><rect x="820" y="20" width="360" height="160" rx="24" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".35"/>
<circle cx="870" cy="72" r="22" fill="#f472b6"><animate attributeName="r" values="22;25;22" dur="3.8s" repeatCount="indefinite"/></circle>
<text x="908" y="80" font-size="26" font-weight="700" fill="#f472b6">Pre-commit</text>
<text x="848" y="134" font-size="20" fill="#64748b">Stops leaks before they commit</text></g>
</svg>
